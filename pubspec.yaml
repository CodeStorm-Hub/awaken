name: awaken
description: "Camera-verified fitness alarm — pay your Wake Up Tax to conquer the morning."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Backend ───────────────────────────────────────────────────────
  supabase_flutter: ^2.5.0
  google_sign_in: ^6.2.1

  # ── Computer vision ───────────────────────────────────────────────
  google_mlkit_pose_detection: ^0.12.0

  # ── Navigation ────────────────────────────────────────────────────
  go_router: ^13.2.0

  # ── UI & animation ────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # ── Phase 4b: Camera + ML Kit pose detection ─────────────────────
  # Live camera feed for squat verification
  camera: ^0.11.0

  # ── Phase 4a: Alarm engine ────────────────────────────────────────
  # Exact alarm scheduling + full-screen intent notifications
  flutter_local_notifications: ^17.2.1
  # Timezone-aware scheduling (required by flutter_local_notifications)
  timezone: ^0.9.4
  flutter_timezone: ^3.0.0
  # In-app alarm audio
  just_audio: ^0.9.36
  # Keep screen on during active alarm
  wakelock_plus: ^1.2.0
  # Runtime permission requests (exact alarm, notifications)
  permission_handler: ^11.3.1
  # Local alarm persistence (pre-Supabase)
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
