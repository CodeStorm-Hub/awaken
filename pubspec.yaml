name: awaken
description: "Camera-verified fitness alarm — pay your Wake Up Tax to conquer the morning."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # ── Backend ───────────────────────────────────────────────────────
  supabase_flutter: ^2.5.0

  # ── Computer vision ───────────────────────────────────────────────
  # Wraps a Google ML Kit native SDK still in BETA (no SLA, no deprecation
  # policy, may break backward compatibility per Google's own docs) — the
  # entire Wake Up Tax feature depends on it. Resolved: 0.15.0 (see
  # pubspec.lock). Check ML Kit Pose Detection release notes before any
  # Flutter/Android SDK bump that could touch this — upgrades to this
  # dependency should be deliberate, not automatic (`flutter pub upgrade`
  # sweeps). See docs/user_story/mlkit_pose_detection_hardening_plan.md §2.3.
  google_mlkit_pose_detection: ^0.15.0

  # ── Navigation ────────────────────────────────────────────────────
  go_router: ^17.3.0

  # ── Territory capture: map + GPS ──────────────────────────────────
  # Pinned to 7.x: vector_map_tiles stable (8.0.0, below) only supports
  # flutter_map ^7.0.2 — flutter_map 8 support exists only in vector_map_tiles
  # 9.0.0-beta.8+ prereleases. Verified 2026-07-14 (`flutter pub get` with
  # flutter_map ^8.0.0 fails version solving against vector_map_tiles ^8.0.0).
  # Re-check when vector_map_tiles ships a stable flutter_map-8 release.
  flutter_map: ^7.0.2
  # Aborts stale tile HTTP during pan/zoom (BSD-3, fleaflet). Deprecated in
  # flutter_map 8 (cancellation moved into the core NetworkTileProvider) —
  # can be dropped once flutter_map is upgraded (see note above).
  flutter_map_cancellable_tile_provider: ^3.0.2
  # Vector tile rendering (OpenFreeMap dark style) — crisp at every zoom,
  # themeable to match AppColors, no API key/commercial-use restriction
  # (unlike the CartoDB raster tiles it replaces).
  vector_map_tiles: ^8.0.0
  # Resolves the OpenFreeMap tile source's TileJSON document for the bundled
  # map style (see territory_map_style.dart) — a direct dependency since we
  # call it ourselves rather than only through vector_map_tiles internals.
  http: ^1.6.0
  # Direct dependency of vector_map_tiles used for reading the map theme
  # (see territory_map_style.dart) — a direct dependency to satisfy analyzer
  # depend_on_referenced_packages.
  vector_tile_renderer: ^5.2.1
  # CancellationException type for expected async tile-render cancels
  executor_lib: ^1.1.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  clock: ^1.1.2

  # ── UI & animation ────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  google_fonts: ^8.1.0

  # ── Phase 4b: Camera + ML Kit pose detection ─────────────────────
  # Live camera feed for squat verification
  camera: ^0.12.0+2

  # ── Phase 4a: Alarm engine ────────────────────────────────────────
  # Exact alarm scheduling + full-screen intent notifications
  flutter_local_notifications: ^22.0.1
  # Timezone-aware scheduling (required by flutter_local_notifications)
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  # In-app alarm audio
  just_audio: ^0.10.6
  # Routes alarm playback to Android's ALARM stream (independent of media
  # volume) and iOS's playback category (sounds through the silent switch).
  audio_session: ^0.2.4
  # Keep screen on during active alarm
  wakelock_plus: ^1.6.1
  # Continuous device vibration while the alarm rings (independent of the
  # notification's one-shot vibration pattern)
  vibration: ^3.1.3
  # Runtime permission requests (exact alarm, notifications)
  permission_handler: ^12.0.3
  # Local alarm persistence (pre-Supabase)
  shared_preferences: ^2.3.2

  # Locale-aware date formatting (replaces hand-rolled weekday/month tables).
  intl: ^0.20.0
  cupertino_icons: ^1.0.8
  share_plus: ^13.2.0
  google_sign_in: ^7.2.0
  # Held at 4.11.0/16.4.1: 4.12.0 paired with firebase_messaging 16.4.2
  # resolves firebase_core_platform_interface 7.1.0, which no longer exposes
  # the `FirebasePlugin`/`pluginConstants` API firebase_messaging 16.4.2's
  # own messaging.dart still calls — a FlutterFire version-skew bug, not an
  # app-code issue. Confirmed via `flutter run`: kernel compile fails with
  # "Type 'FirebasePlugin' not found". Re-check when either package publishes
  # a fix.
  firebase_core: 4.11.0
  firebase_messaging: 16.4.1
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  # Held at 2.15.1: 2.15.2 requires analyzer >=13.3.0, which conflicts with
  # riverpod_lint 3.x's analyzer ^12.0.0 constraint.
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  # riverpod_lint 3.x dropped its custom_lint dependency (now built on
  # analysis_server_plugin directly) — no explicit custom_lint dep needed.
  riverpod_lint: ^3.1.4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/map_styles/
