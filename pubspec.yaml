name: awaken
description: "Camera-verified fitness alarm — pay your Wake Up Tax to conquer the morning."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Backend ───────────────────────────────────────────────────────
  supabase_flutter: ^2.5.0

  # ── Computer vision ───────────────────────────────────────────────
  google_mlkit_pose_detection: ^0.12.0

  # ── Navigation ────────────────────────────────────────────────────
  go_router: ^13.2.0

  # ── UI & animation ────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
