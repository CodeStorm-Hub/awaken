kotlin.jvm.target.validation.mode=warning
# Kotlin's incremental compiler tries to store a relative path between plugin
# sources (on the pub-cache drive) and the build output (on this project's
# drive). When those are different Windows drive letters, relativeTo() throws
# and corrupts the incremental cache close — surfaces as spurious
# "compileDebugKotlin" failures for flutter_timezone/package_info_plus/
# camera_android_camerax. Disabling incremental compilation avoids that path.
kotlin.incremental=false

